name: Telegram Bot 24/7 Runner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # GitHub Actions အိပ်မသွားစေရန် တာဝန်ခံပေးသော Cron (နာရီတိုင်း အလုပ်လုပ်မည်)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyTelegramBotAPI aiohttp opencv-python ddddocr numpy

    - name: Run Bot
      run: |
        python main.py
